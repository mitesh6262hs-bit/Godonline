<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <!-- Header / Navbar -->
    <header class="header">
        <div class="logo">📱 Admin Panel</div>
        <div class="status-container">
            <span id="statusBadge" class="connection-status offline"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </header>

    <!-- Main Navigation -->
    <nav class="nav-bar">
        <button class="nav-item active" data-panel="devices" onclick="togglePanel('devices')">
            📱 Devices (<span id="deviceCount">0</span>)
        </button>
        <button class="nav-item" data-panel="sms" onclick="togglePanel('sms')">
            💬 SMS (<span id="smsCount">0</span>)
        </button>

        <button class="nav-item" data-panel="backup" onclick="togglePanel('backup')">
            💾 Backup
        </button>
        <button class="nav-item" data-panel="analytics" onclick="togglePanel('analytics')">
            📊 Analytics
        </button>
    </nav>

    <main class="main-content">
        <!-- DEVICES PANEL -->
        <section id="panelDevices" class="panel active">
            <div class="panel-header">
                <h2>Devices (<span id="panelDeviceCount">0</span>)</h2>
                <div class="filter-group">
                    <button id="filterAll" class="filter-btn active" onclick="filterDevices('all')">All</button>
                    <button id="filterOnline" class="filter-btn" onclick="filterDevices('online')">Online</button>
                    <button id="filterOffline" class="filter-btn" onclick="filterDevices('offline')">Offline</button>
                </div>
            </div>
            <div id="devicesContainer" class="devices-grid"></div>
        </section>

        <!-- SMS PANEL -->
        <section id="panelSms" class="panel">
            <div class="panel-header">
                <h2>All SMS (<span id="panelSmsCount">0</span>)</h2>
                <button id="clearSmsFilterBtn" class="btn-luxury btn-red" style="display:none;" onclick="clearSmsFilter()">Clear Filter</button>
            </div>
            <div id="allSmsContainer" class="sms-list-luxury"></div>
            <button id="allSmsLoadMore" class="btn-load-more" style="display:none;" onclick="loadMoreAllSms()">Load More</button>
        </section>

        <!-- BACKUP PANEL -->
        <section id="panelBackup" class="panel">
            <h2>Backup Management</h2>
            <div class="backup-controls">
                <select id="backupDeviceSelect">
                    <option value="">— Select a device —</option>
                </select>
                <button class="btn-luxury btn-purple" onclick="triggerBackup()">Trigger Backup</button>
                <button class="btn-luxury btn-blue" onclick="refreshBackupStatus()">Refresh Status</button>
                <button class="btn-luxury btn-red" onclick="clearBackupStatus()">Clear</button>
                <button class="btn-luxury" style="background:var(--gold);color:#000;" onclick="openBackupSmsModal()">View All Backups</button>
            </div>
            <div class="backup-info-card" style="margin-top: 15px;">
                <div>Status: <span id="backupStatusValue" class="status-value">—</span> <span id="backupStatusBadge"></span></div>
                <div>Last Backup: <span id="backupLastTime">—</span></div>
                <div>Total SMS Backed Up: <span id="backupSmsCount">0</span></div>
                <div>Backup ID: <span id="backupId">N/A</span></div>
            </div>
            <div id="backupSmsList" class="sms-list-luxury" style="margin-top:15px;"></div>
        </section>

        <!-- ANALYTICS PANEL -->
        <section id="panelAnalytics" class="panel">
            <h2>System Analytics</h2>
            <div class="analytics-grid">
                <div class="analytic-card">Total Devices: <b id="analyticsTotalDevices">0</b></div>
                <div class="analytic-card">Total SMS: <b id="analyticsTotalSms">0</b></div>
                <div class="analytic-card">Total Backups: <b id="analyticsBackupSms">0</b></div>
                <div class="analytic-card">Last Activity: <b id="analyticsLastActivity">—</b></div>
            </div>
        </section>
    </main>

    <!-- SMS MODAL -->
    <div id="smsModal" class="modal-overlay" onclick="closeSmsModal(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Messages</h3>
                <button class="close-btn" onclick="closeSmsModal()">&times;</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
            <button id="modalLoadMore" class="btn-load-more" style="display:none;" onclick="renderModalSms()">Load More</button>
        </div>
    </div>

    <!-- BACKUP SMS MODAL -->
    <div id="backupSmsModal" class="modal-overlay" onclick="closeBackupSmsModal(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="backupModalTitle">Backup Messages</h3>
                <button class="close-btn" onclick="closeBackupSmsModal()">&times;</button>
            </div>
            <div id="backupModalBody" class="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
